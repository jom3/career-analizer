<section class="profile-page">
  <header class="page-head">
    <div>
      <h1 class="page-title">{{ i18n.t('profile.title') }}</h1>
      <p class="page-sub">{{ i18n.t('profile.subtitle') }}</p>
    </div>
    <div class="actions">
      <button
        type="button"
        class="btn btn--secondary"
        (click)="onDownload('pdf')"
        [disabled]="downloading() !== null"
      >
        {{ downloading() === 'pdf' ? i18n.t('profile.generating') : i18n.t('profile.pdf') }}
      </button>
      <button
        type="button"
        class="btn btn--secondary"
        (click)="onDownload('docx')"
        [disabled]="downloading() !== null"
      >
        {{ downloading() === 'docx' ? i18n.t('profile.generating') : i18n.t('profile.docx') }}
      </button>
      <button
        type="button"
        class="btn btn--secondary"
        (click)="onTranslate()"
        [disabled]="translating() || loading()"
      >
        {{ translating() ? i18n.t('profile.translating') : i18n.t(translateButtonKey()) }}
      </button>
      <button type="button" class="btn btn--primary" (click)="onSave()" [disabled]="saving()">
        {{ saving() ? i18n.t('profile.saving') : i18n.t('profile.save') }}
      </button>
    </div>
  </header>

  @if (loadError()) {
    <p class="alert alert--error" role="alert">{{ loadError() }}</p>
  } @else if (loading()) {
    <p class="muted">{{ i18n.t('profile.loading') }}</p>
  } @else {
    @if (errorMessage()) {
      <p class="alert alert--error" role="alert">{{ errorMessage() }}</p>
    }
    @if (saved()) {
      <p class="alert alert--success" role="status">{{ i18n.t('profile.saved') }}</p>
    }

    <div class="lang-tabs" role="tablist">
      <button
        type="button"
        class="lang-tab"
        [class.lang-tab--active]="isActiveLang('es')"
        role="tab"
        [attr.aria-selected]="isActiveLang('es')"
        (click)="onSelectLang('es')"
      >
        {{ i18n.t('profile.tabEs') }}
      </button>
      <button
        type="button"
        class="lang-tab"
        [class.lang-tab--active]="isActiveLang('en')"
        role="tab"
        [attr.aria-selected]="isActiveLang('en')"
        (click)="onSelectLang('en')"
      >
        {{ i18n.t('profile.tabEn') }}
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSave()" class="profile-form">
      <app-personal-info-section
        [headline]="form.controls.headline"
        [phone]="form.controls.phone"
        [location]="form.controls.location"
        [website]="form.controls.website"
        [linkedin]="form.controls.linkedin"
      />

      <app-summary-section [summary]="form.controls.summary" />

      <app-experience-section
        [experiences]="experiences"
        [duplicateIndices]="duplicateExperienceIndices()"
        [overlapIndices]="overlapIndices()"
      />

      <app-skills-section
        [skills]="skills"
        [duplicateIndices]="duplicateSkillIndices()"
      />

      <app-education-section [education]="education" />

      <app-certifications-section [certifications]="certifications" />

      <app-projects-section [projects]="projects" />

      <app-languages-section [languages]="languages" />

      <div class="sticky-actions">
        <button type="submit" class="btn btn--primary" [disabled]="saving()">
          {{ saving() ? i18n.t('profile.saving') : i18n.t('profile.save') }}
        </button>
      </div>
    </form>
  }
</section>
