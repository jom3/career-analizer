<section class="auth-page">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-card">
    <p class="eyebrow">{{ i18n.t('app.title') }}</p>
    <h1>{{ i18n.t('auth.login.title') }}</h1>
    <p class="subtitle">{{ i18n.t('auth.login.subtitle') }}</p>

    @if (errorMessage) {
      <p class="alert alert--error" role="alert">{{ errorMessage }}</p>
    }

    <label class="form-field">
      {{ i18n.t('auth.email') }}
      <input formControlName="email" type="email" autocomplete="email" />
    </label>

    <label class="form-field">
      {{ i18n.t('auth.password') }}
      <input
        formControlName="password"
        type="password"
        autocomplete="current-password"
      />
    </label>

    <button type="submit" class="btn btn--primary btn--block" [disabled]="submitting">
      {{ submitting ? i18n.t('auth.login.submitting') : i18n.t('auth.login.submit') }}
    </button>

    <p class="switch">
      {{ i18n.t('auth.login.switchHint') }}
      <a routerLink="/auth/register">{{ i18n.t('auth.login.switchLink') }}</a>
    </p>
  </form>
</section>
