services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    container_name: career_analyzer_backend
    restart: unless-stopped
    working_dir: /app
    command: npm run start:backend
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: build
    container_name: career_analyzer_frontend
    restart: unless-stopped
    working_dir: /app
    command: npm run start -w career-analyzer-frontend -- --host 0.0.0.0 --poll 1000
    environment:
      API_PROXY_TARGET: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules: