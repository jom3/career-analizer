<section class="auth-page">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-card">
    <p class="eyebrow">{{ i18n.t('app.title') }}</p>
    <h1>{{ i18n.t('auth.register.title') }}</h1>
    <p class="subtitle">{{ i18n.t('auth.register.subtitle') }}</p>

    @if (errorMessage) {
      <p class="alert alert--error" role="alert">{{ errorMessage }}</p>
    }

    <label class="form-field">
      {{ i18n.t('auth.name') }}
      <input formControlName="name" type="text" autocomplete="name" />
    </label>

    <label class="form-field">
      {{ i18n.t('auth.email') }}
      <input formControlName="email" type="email" autocomplete="email" />
    </label>

    <label class="form-field">
      {{ i18n.t('auth.passwordHint') }}
      <input
        formControlName="password"
        type="password"
        autocomplete="new-password"
      />
    </label>

    <button type="submit" class="btn btn--primary btn--block" [disabled]="submitting">
      {{ submitting ? i18n.t('auth.register.submitting') : i18n.t('auth.register.submit') }}
    </button>

    <p class="switch">
      {{ i18n.t('auth.register.switchHint') }}
      <a routerLink="/auth/login">{{ i18n.t('auth.register.switchLink') }}</a>
    </p>
  </form>
</section>
