services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    container_name: career_analyzer_backend
    restart: unless-stopped
    env_file: .env
    working_dir: /app/backend
    command: ["node", "dist/main.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - uploads:/app/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    container_name: career_analyzer_frontend
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  uploads: